version: '3.8'

services:
  # Redis Cache & Queue Storage
  redis:
    image: redis:7-alpine
    container_name: hr_platform_redis
    restart: always
    ports:
      # Local Host Port : Container Isolated Port
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data: